<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Portal Atleta</title>
    <link rel="stylesheet" href="loginPatrocinador.css">
    <script src="https://kit.fontawesome.com/ca14b9e588" crossorigin="anonymous"></script>
</head>
<body class="imgBack">
    
    <div id="bnt-voltar">
        <a href="loginCentral.html">Voltar</a>
    </div>

    <div id="backgroundImage"> </div>
    <div id="form">
        <form action="">
            <h2 class="title">Cadastro de Patrocinador</h2>

            <label for="username">Nome da Empresa</label>
            <div class="input">
                <input id="username" name="username" placeholder="Nome da Empresa" type="text"> 
            </div>
            
            <label for="email">E-mail Comercial</label>
            <div class="input">
                <input id="email" name="email" placeholder="E-mail Comercial" type="email">
            </div>

            <label for="senha">Senha</label>
            <div class="input">
                <input id="senha" name="senha" placeholder="Senha" type="password">
            </div>

            <label for="CEP">CEP</label>
            <div class="input">
                <input id="CEP" name="CEP" placeholder="CEP" type="text">
            </div>

            <label for="CNPJ">CNPJ</label>
            <div class="input">
                <input id="CNPJ" name="CNPJ" placeholder="CNPJ" type="text">
            </div>

            <label for="Razão Social">Razão Social</label>
            <div class="input">
                <input id="Razão Social" name="Razão Social" placeholder="Razão Social" type="text">
            </div>

            <label for="Tipo Juridico">Tipo Juridico</label>
            <div class="input">
                <input id="Tipo Juridico" name="Tipo Juridico" placeholder="Tipo Juridico" type="text">
            </div>

            <label for="Ramo da Atividade">Ramo da Atividade</label>
            <div class="input">
                <input id="Ramo da Atividade" name="Ramo da Atividade" placeholder="Ramo da Atividade" type="text">
            </div>


            <div id="btn">
                <button type="submit">Cadastrar</button>
            </div>
        </form>
    </div>
</body>
</html>
